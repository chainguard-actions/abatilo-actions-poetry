name: "Python Poetry Action"
author: "@abatilo"
description: "An action to run https://github.com/python-poetry/poetry"
branding:
  icon: "truck"
  color: "gray-dark"
inputs:
  poetry-version:
    description: "The version of poetry to install"
    required: false
    default: "latest"
  poetry-plugins:
    description: "The whitespace/newline-separated list of poetry plugins to install."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - run: |
        python3 -m pip install --user pipx
        python3 -m pipx ensurepath
      shell: bash
    - if: ${{ inputs.poetry-version == 'latest' }}
      run: |
        pipx install poetry
      shell: bash
    - if: ${{ inputs.poetry-version == 'main' }}
      run: |
        pipx install git+https://github.com/python-poetry/poetry.git@main
      shell: bash
    - if: ${{ inputs.poetry-version != 'latest' && inputs.poetry-version != 'main' }}
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
      run: |
        pipx install "poetry==$POETRY_VERSION"
      shell: bash
    - if: ${{ inputs.poetry-plugins != '' }}
      env:
        POETRY_PLUGINS: ${{ inputs.poetry-plugins }}
      run: |
        plugins=()
        while IFS= read -r -d '' t; do plugins+=("$t"); done \
          < <(printf '%s' "$POETRY_PLUGINS" | xargs printf '%s\0')
        for PLUGIN in "${plugins[@]}"; do
          poetry self add "$PLUGIN"
        done
      shell: bash
