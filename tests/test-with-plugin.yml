name: Test poetry installation with plugin
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-configure PATH for pipx
        run: |
          # Ensure ~/.local/bin is on PATH for all subsequent steps (including composite action steps)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Pre-install pipx so the action's pipx ensurepath works correctly
          pip install --user pipx || pip3 install --user pipx || true
      - id: action
        uses: .
        with:
          poetry-plugins: "poetry-plugin-export"
      - name: Assert poetry is installed and plugin is present
        run: |
          echo "Checking poetry installation..."
          echo "PATH: $PATH"
          if ! command -v poetry >/dev/null 2>&1; then
            echo "FAIL: poetry command not found"
            echo "Contents of ~/.local/bin:"
            ls -la "$HOME/.local/bin" 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "Checking poetry-plugin-export is installed..."
          PLUGIN_LIST=$(poetry self show plugins 2>&1)
          echo "actual plugins: $PLUGIN_LIST"
          if ! echo "$PLUGIN_LIST" | grep -qi "poetry-plugin-export"; then
            echo "FAIL: poetry-plugin-export not found in plugin list"
            exit 1
          fi
          echo "PASS: poetry and poetry-plugin-export plugin are installed"
